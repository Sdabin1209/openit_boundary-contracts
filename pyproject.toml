[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-contracts"
version = "3.1.2"
requires-python = ">=3.10"
description = "영역 사이 계약의 스키마와 기준 구현. 버전 MAJOR.MINOR는 pipeline_schema_version과 같다."
dependencies = ["jsonschema>=4.10"]

[tool.setuptools]
packages = ["boundary_contracts", "boundary_contracts.clients", "conformance"]

[tool.setuptools.package-data]
boundary_contracts = ["schemas/*.json", "metrics.json", "data/*.json"]
conformance = ["examples/*.json", "examples_invalid/*.json", "promoted/*.json"]
